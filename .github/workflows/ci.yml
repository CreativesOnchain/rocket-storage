name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Unit and integration tests (offline)
        run: cargo test --workspace
        # Live capture tests require ETH_RPC_URL; skip in CI unless secret set
        env:
          ETH_RPC_URL: ""

  build-binary:
    name: Build release binary
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - name: Build release
        run: cargo build --release -p rsg-cli

      - name: Smoke-test binary
        run: ./target/release/rsg --version

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: rsg-linux-x86_64
          path: target/release/rsg

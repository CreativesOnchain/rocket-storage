[workspace]
members = [
    "crates/rsg-types",
    "crates/rsg-decode",
    "crates/rsg-capture",
    "crates/rsg-compare",
    "crates/rsg-attest",
    "crates/rsg-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Rocket Pool Verification Contributors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Ethereum / alloy
alloy = { version = "2.4", features = [
    "full",
    "rpc-types-trace",
    "rpc-types-debug",
    "provider-debug-api",
] }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
serde_yaml  = "0.9"

# Hashing
sha2 = "0.10"
sha3 = "0.10"

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Error handling
anyhow  = "1"
thiserror = "1"

# Misc
hex     = "0.4"
chrono  = { version = "0.4", features = ["serde"] }
indexmap = { version = "2", features = ["serde"] }

# Internal crates
rsg-types   = { path = "crates/rsg-types" }
rsg-decode  = { path = "crates/rsg-decode" }
rsg-capture = { path = "crates/rsg-capture" }
rsg-compare = { path = "crates/rsg-compare" }
rsg-attest  = { path = "crates/rsg-attest" }
